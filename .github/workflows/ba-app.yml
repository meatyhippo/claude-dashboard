# Builds the BA edition's Mac app and publishes it, so a BA installs it with
# get.sh and never needs git, Homebrew, Node or Bun on their own Mac.
#
# Started by hand only (Actions → BA app → Run workflow). The repository is
# private, where a Mac runner costs ten times its minutes: about twenty builds
# use up a month's free minutes. So after a merge, publish from your own Mac
# instead, for free:  ./scripts/publish-ba-app.sh
#
# Either way the app goes on one rolling release, tag `ba-app`, as
# Claude-Dashboard-arm64-<build>.zip, with build.txt naming the current build
# and get.sh itself. scripts/publish-ba-app.sh does both halves, and explains
# the order the files are replaced in.
name: BA app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # GitHub's current macOS image, which runs on Apple silicon like the app. A
    # pinned version label stops getting machines once GitHub retires it.
    runs-on: macos-latest
    # A newer push makes a build in progress pointless.
    concurrency:
      group: ba-app-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # The version the build was tested with; 1.4 already broke Electron's
          # download script once (see scripts/publish-ba-app.sh).
          bun-version: 1.4.5

      - name: Build the app
        run: ./scripts/publish-ba-app.sh --build-only

      - uses: actions/upload-artifact@v4
        with:
          name: ba-app
          path: build/ba-app/
          retention-days: 3
          compression-level: 0

  publish:
    needs: build
    # A manual run from another branch builds it, as a check, but only
    # qargo-ba-edition reaches the BAs.
    if: github.ref == 'refs/heads/qargo-ba-edition'
    runs-on: ubuntu-latest
    # Never cancelled half-way, since it replaces files people are downloading.
    # A newer publish waits until this one is done.
    concurrency:
      group: ba-app-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ba-app
          path: build/ba-app

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-ba-app.sh --no-build --repo "$GITHUB_REPOSITORY"
